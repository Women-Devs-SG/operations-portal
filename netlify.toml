[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22.22.0"

[dev]
  command = "vite --configLoader runner"
  targetPort = 5173
  port = 8888
  publish = "dev-static"
  autoLaunch = false

# Pretty API paths -> Netlify Functions. status 200 rewrites (not redirects),
# so the browser keeps calling /api/* and everything stays same-origin.
[[redirects]]
  from = "/api/create-task"
  to = "/.netlify/functions/create-task"
  status = 200

[[redirects]]
  from = "/api/tasks"
  to = "/.netlify/functions/tasks"
  status = 200

[[redirects]]
   from = "/*"
   to = "/index.html"
   status = 200

# Production page security headers live in static/_headers; `vite build` copies
# them to dist/_headers for deployment. Netlify Dev also reads _headers from the
# project root and dist (not the dev publish dir), so the predev script deletes
# dist first — otherwise the production CSP blocks Vite's inline React preamble
# and injected styles locally. Header rules load when the dev server starts, so
# a clean start is enough.

# Task data is private; never let a proxy or the browser cache an API response.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
